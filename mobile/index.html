<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Ash Schnoor: social media and content, mostly for music. All my links in one place.">
<meta name="theme-color" content="#0F0B10">

<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">

<style>
  :root {
    --bg: #0F0B10; --surface: #1A1318; --cream: #F6EEE9; --soft: #B9ADB3;
    --pink: #E954AF; --on-pink: #0F0B10;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --script: "Ballet", cursive;
    --body: "Nunito", system-ui, sans-serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh;
    background: var(--bg); color: var(--cream);
    font: 400 1rem/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  ::selection { background: var(--pink); color: var(--on-pink); }
  :focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  main {
    width: min(100% - 2rem, 26rem); margin: 0 auto;
    padding: max(2.5rem, env(safe-area-inset-top)) 0 2.5rem;
    flex: 1;
  }
  .head { text-align: center; }
  .badge { width: 7.5rem; height: 7.5rem; margin: 0 auto; position: relative; }
  .badge svg { width: 100%; height: 100%; }
  .badge img { position: absolute; inset: 22%; width: 56%; height: auto; }
  h1 {
    margin: 1rem 0 0;
    font: 800 3.1rem/0.9 var(--display); font-variation-settings: "opsz" 96;
    letter-spacing: -0.04em; color: var(--pink);
  }
  .script {
    display: inline-flex; align-items: center; gap: 0.25rem;
    margin: 0.35rem 0 0;
    font: 400 2.2rem/1 var(--script); color: var(--cream);
    transform: rotate(-4deg);
  }
  .script svg { width: 0.5em; height: 0.5em; fill: var(--pink); }
  .lede { margin: 0.9rem 0 0; color: var(--soft); }

  .links { list-style: none; margin: 2rem 0 0; padding: 0; display: grid; gap: 0.7rem; }
  .links a {
    display: flex; align-items: center; gap: 0.9rem;
    min-height: 3.6rem; padding: 0.5rem 1.1rem 0.5rem 0.6rem;
    border-radius: 999px;
    background: var(--surface); color: var(--cream);
    outline: 1px solid rgb(246 238 233 / 0.12); outline-offset: -1px;
    font: 700 1.0625rem/1.2 var(--body);
    text-decoration: none;
    transition: transform 0.3s var(--ease-out), background-color 0.2s, color 0.2s;
  }
  .links a:hover, .links a:active { background: var(--pink); color: var(--on-pink); transform: translateY(-2px); }
  .links .primary a { background: var(--pink); color: var(--on-pink); outline: 0; }
  .links .primary a:hover { background: var(--cream); }
  .icon {
    display: grid; place-items: center; flex: none;
    width: 2.5rem; height: 2.5rem; border-radius: 50%;
    background: var(--bg); color: var(--cream);
  }
  .primary .icon { background: var(--on-pink); color: var(--pink); }
  .icon svg { width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .label { flex: 1; }
  .label small { display: block; font-weight: 400; font-size: 0.85rem; opacity: 0.75; }
  .arrow { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }

  .band {
    background: var(--pink); color: var(--on-pink); overflow: hidden;
    padding: 0.75rem 0 max(0.75rem, env(safe-area-inset-bottom));
  }
  .band__track { display: flex; width: max-content; animation: drift 26s linear infinite; }
  .band__run { display: flex; align-items: center; gap: 1rem; padding-right: 1rem; white-space: nowrap;
    font: 800 1.05rem/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
  .band__run svg { width: 0.9em; height: 0.9em; fill: var(--on-pink); }
  @keyframes drift { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .band__track { animation: none; }
    .links a { transition: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="sparkle" viewBox="0 0 24 24"><path d="M12 0C12.9 7.3 16.7 11.1 24 12 16.7 12.9 12.9 16.7 12 24 11.1 16.7 7.3 12.9 0 12 7.3 11.1 11.1 7.3 12 0Z"/></symbol>
    <symbol id="starburst" viewBox="0 0 100 100"><polygon points="50,0 56.7,24.9 75,6.7 68.4,31.6 93.3,25 75.1,43.3 100,50 75.1,56.7 93.3,75 68.4,68.4 75,93.3 56.7,75.1 50,100 43.3,75.1 25,93.3 31.6,68.4 6.7,75 24.9,56.7 0,50 24.9,43.3 6.7,25 31.6,31.6 25,6.7 43.3,24.9"/></symbol>
  </defs>
</svg>

<main>
  <header class="head">
    <div class="badge">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#E954AF" d="M50 8A7.66 7.66 0 0 1 64.36 10.53A7.66 7.66 0 0 1 77 17.83A7.66 7.66 0 0 1 86.37 29A7.66 7.66 0 0 1 91.36 42.71A7.66 7.66 0 0 1 91.36 57.29A7.66 7.66 0 0 1 86.37 71A7.66 7.66 0 0 1 77 82.17A7.66 7.66 0 0 1 64.36 89.47A7.66 7.66 0 0 1 50 92A7.66 7.66 0 0 1 35.64 89.47A7.66 7.66 0 0 1 23 82.17A7.66 7.66 0 0 1 13.63 71A7.66 7.66 0 0 1 8.64 57.29A7.66 7.66 0 0 1 8.64 42.71A7.66 7.66 0 0 1 13.63 29A7.66 7.66 0 0 1 23 17.83A7.66 7.66 0 0 1 35.64 10.53A7.66 7.66 0 0 1 50 8Z"/></svg>
      <img src="../images/cat-head.svg" alt="" width="124" height="104">
    </div>
    <h1>Ash Schnoor</h1>
    <p class="script"><svg aria-hidden="true"><use href="#sparkle"/></svg>say hi</p>
    <p class="lede">social media and content, mostly for music.</p>
  </header>

  <ul class="links" id="links"></ul>
</main>

<div class="band" aria-hidden="true">
  <div class="band__track">
    <div class="band__run"><span>Content</span><svg><use href="#starburst"/></svg><span>PR</span><svg><use href="#starburst"/></svg><span>Tour marketing</span><svg><use href="#starburst"/></svg><span>Web</span><svg><use href="#starburst"/></svg><span>Social media strategy</span><svg><use href="#starburst"/></svg><span>Digital marketing</span><svg><use href="#starburst"/></svg></div>
    <div class="band__run"><span>Content</span><svg><use href="#starburst"/></svg><span>PR</span><svg><use href="#starburst"/></svg><span>Tour marketing</span><svg><use href="#starburst"/></svg><span>Web</span><svg><use href="#starburst"/></svg><span>Social media strategy</span><svg><use href="#starburst"/></svg><span>Digital marketing</span><svg><use href="#starburst"/></svg></div>
  </div>
</div>

<script>
  // Resume PDF path relative to this page. Empty hides the link.
  const RESUME = "";

  const ICON = {
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>',
    site: '<path d="M12 2.5c2.6 0 4.6 0 6.5 1.9S20.4 8.4 21.5 12c-1.1 3.6-1.1 5.7-3 7.6s-3.9 1.9-6.5 1.9-4.6 0-6.5-1.9S3.6 15.6 2.5 12c1.1-3.6 1.1-5.7 3-7.6S9.4 2.5 12 2.5z"/><path d="M12 7c.4 2.6 2.4 4.6 5 5-2.6.4-4.6 2.4-5 5-.4-2.6-2.4-4.6-5-5 2.6-.4 4.6-2.4 5-5z"/>',
    resume: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"/>',
    tiktok: '<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 2.7 2.3 4.4 5 4.7"/>',
    linkedin: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V17M8 7.2v.1M12 17v-6.5M12 13.5c0-2 1.2-3 2.7-3s2.3 1 2.3 3V17"/>',
    stats: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
  };

  const LINKS = [
    { label: "email me", sub: "hey@ashie.pics", href: "mailto:hey@ashie.pics", icon: "mail", primary: true },
    { label: "portfolio", sub: "the full site, with the work", href: "../", icon: "site" },
    { label: "resume", sub: "pdf", href: RESUME, icon: "resume" },
    { label: "instagram", sub: "@underscoreashie", href: "https://www.instagram.com/underscoreashie", icon: "instagram" },
    { label: "tiktok", sub: "@underscoreashie", href: "https://www.tiktok.com/@underscoreashie", icon: "tiktok" },
    { label: "linkedin", sub: "in/ashie", href: "https://www.linkedin.com/in/ashie", icon: "linkedin" },
    { label: "coverage + stats", sub: "on gondola", href: "https://gondola.cc/underscoreashie", icon: "stats" }
  ];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  document.getElementById("links").innerHTML = LINKS.filter((l) => l.href).map((l) => {
    const external = /^https?:/.test(l.href);
    return `<li${l.primary ? ' class="primary"' : ""}><a href="${esc(l.href)}"${external ? ' target="_blank" rel="noopener"' : ""}>
      <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[l.icon]}</svg></span>
      <span class="label">${esc(l.label)}<small>${esc(l.sub)}</small></span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </a></li>`;
  }).join("");
</script>
</body>
</html>
